name: Update Language Stats

on:
    schedule:
        - cron: "0 0 * * 1" # Every Monday
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: https://code.forgejo.org/actions/checkout@v4

            - name: Install Rust toolchain
              shell: bash
              run: |
                  curl --proto "=https" --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
                  sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Build self-reposcope
              shell: bash
              run: cargo build --release

            - name: Run self-reposcope CLI
              shell: bash
              run: |
                  mkdir -p output
                  ./target/release/self-reposcope \
                    --token "${{ secrets.REPOSCOPE_TOKEN }}" \
                    --forgejo-url "${{ github.server_url }}" \
                    --forgejo-token "${{ secrets.REPOSCOPE_FORGEJO_TOKEN }}" \
                    --excluded-languages "${{ secrets.EXCLUDED_LANGUAGES }}"

            - name: Commit and Push updated SVGs
              shell: bash
              run: |
                  git config --global user.name 'forgejo-actions[bot]'
                  git config --global user.email 'forgejo-actions[bot]@users.noreply.localhost'
                  git add output/*.svg
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "update: language stats svg"
                    git push origin HEAD:main
                  fi
