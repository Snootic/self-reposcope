name: Test self-reposcope

on:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: https://code.forgejo.org/actions/checkout@v4

            - name: Install Rust toolchain
              shell: bash
              run: |
                  curl --proto "=https" --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
                  sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - name: Build self-reposcope
              shell: bash
              run: cargo build --release

            - name: Run self-reposcope (with secrets)
              shell: bash
              run: |
                  mkdir -p output
                  ./target/release/self-reposcope \
                    --token "${{ secrets.REPOSCOPE_TOKEN }}" \
                    --forgejo-url "${{ github.server_url }}" \
                    --forgejo-token "${{ secrets.FORGEJO_TOKEN }}" \
                    --excluded-languages "${{ secrets.EXCLUDED_LANGUAGES }}"
